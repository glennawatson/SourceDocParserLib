name: .NET Build
description: Standard dotnet CLI restore, build, and optional pack
inputs:
  configuration:
    description: 'Build configuration'
    required: false
    default: 'Release'
  src-folder:
    description: 'Folder containing the solution'
    required: false
    default: 'src'
  solution-file:
    description: 'Solution file relative to src-folder'
    required: false
    default: ''
  create-packages:
    description: 'Run dotnet pack after build'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - id: shared
    uses: glennawatson/actions-common/.github/actions/dotnet-build@d1a1652f1d0e4ad7d2f77bda30b58f4b42ab0748 # main
    with:
      configuration: ${{ inputs.configuration }}
      src-folder: ${{ inputs.src-folder }}
      solution-file: ${{ inputs.solution-file }}
      create-packages: ${{ inputs.create-packages }}
