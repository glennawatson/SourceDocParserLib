name: MinVer
description: Install the minver-cli dotnet global tool and stamp MINVER_* environment variables and step outputs for the current commit.
inputs:
  tag-prefix:
    description: 'Tag prefix MinVer expects on release tags.'
    required: false
    default: 'v'
  minimum-major-minor:
    description: 'Floor major.minor when no tag is reachable. Empty leaves the MinVer default of 0.0.'
    required: false
    default: '1.4'
  default-pre-release-identifiers:
    description: 'Pre-release identifier(s) for height-only builds.'
    required: false
    default: 'alpha.0'
  auto-increment:
    description: 'Which segment MinVer auto-increments past the latest tag (major|minor|patch).'
    required: false
    default: 'minor'
  version-override:
    description: 'Exact version to stamp, bypassing the MinVer git walk. Empty = compute the version from git tags as normal.'
    required: false
    default: ''
  verbosity:
    description: 'MinVer CLI verbosity (error|warn|info|debug|trace).'
    required: false
    default: 'info'
outputs:
  SemVer2:
    description: 'Full MinVer SemVer2 version string (e.g. 4.2.3-alpha.0.45+sha.abcdef0)'
    value: ${{ steps.shared.outputs.SemVer2 }}
  SimpleVersion:
    description: 'major.minor.patch only (no pre-release / metadata)'
    value: ${{ steps.shared.outputs.SimpleVersion }}
  NuGetPackageVersion:
    description: 'NuGet-compatible version (SemVer2 without build metadata)'
    value: ${{ steps.shared.outputs.NuGetPackageVersion }}
  GitCommitId:
    description: 'Full SHA of HEAD'
    value: ${{ steps.shared.outputs.GitCommitId }}
  VersionHeight:
    description: 'Commits since the last reachable version tag'
    value: ${{ steps.shared.outputs.VersionHeight }}
runs:
  using: composite
  steps:
  - id: shared
    uses: glennawatson/actions-common/.github/actions/minver@main
    with:
      tag-prefix: ${{ inputs.tag-prefix }}
      minimum-major-minor: ${{ inputs.minimum-major-minor }}
      default-pre-release-identifiers: ${{ inputs.default-pre-release-identifiers }}
      auto-increment: ${{ inputs.auto-increment }}
      version-override: ${{ inputs.version-override }}
      verbosity: ${{ inputs.verbosity }}
