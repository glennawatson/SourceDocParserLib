name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Build, test, and analyze
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Environment
        id: environment
        uses: ./.github/actions/dotnet-environment

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Begin Sonar analysis
        id: sonar-begin
        uses: ./.github/actions/sonarcloud
        with:
          mode: begin
          project-key: glennawatson_SourceDocParserLib
          organization: glennawatson
          version: ${{ steps.environment.outputs.version-semver2 }}
          exclusions: '**/tests/**,**/benchmarks/**,**/tools/**'
          coverage-exclusions: '**/tests/**,**/benchmarks/**,**/tools/**'
          cpd-exclusions: '**/tests/**,**/benchmarks/**,**/tools/**'
          test-exclusions: '**/tests/**,**/benchmarks/**,**/tools/**'
          working-directory: src

      - name: Build
        uses: ./.github/actions/dotnet-build
        with:
          solution-file: SourceDocParserLib.slnx

      - name: Test
        uses: ./.github/actions/dotnet-test
        with:
          solution-file: SourceDocParserLib.slnx

      - name: End Sonar analysis
        if: always() && steps.sonar-begin.outcome == 'success'
        uses: ./.github/actions/sonarcloud
        with:
          mode: end
          project-key: glennawatson_SourceDocParserLib
          working-directory: src
