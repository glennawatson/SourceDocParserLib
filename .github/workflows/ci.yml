name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MINVERVERSIONOVERRIDE: 0.0.0-ci.0+${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Python is required by SourceDocParser.IntegrationTests' Zensical
      # render-smoke. The test creates its own venv at
      # tests/SourceDocParser.IntegrationTests/zensical/.venv on first run
      # and pip-installs zensical + pymdown-extensions into it; we just
      # need a system python3 for `python3 -m venv` to succeed.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Restore
        run: dotnet restore src/SourceDocParserLib.slnx

      - name: Build
        run: dotnet build src/SourceDocParserLib.slnx --no-restore --configuration Release

      - name: Test
        working-directory: src
        run: dotnet test --solution SourceDocParserLib.slnx --no-build --configuration Release
