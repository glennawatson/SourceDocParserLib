name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release increment."
        required: true
        type: choice
        options:
          - "(pick one)"
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      source-sha: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Environment
        uses: ./.github/actions/dotnet-environment
        with:
          stamp-version: 'false'

      - name: Compute release version
        id: ver
        uses: ./.github/actions/compute-version-and-tag
        with:
          bump: ${{ inputs.bump }}
          tag-prefix: 'v'
          push-tag: 'false'

      - name: Stamp release version
        uses: ./.github/actions/minver
        with:
          version-override: ${{ steps.ver.outputs.version }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Build
        uses: ./.github/actions/dotnet-build
        with:
          solution-file: SourceDocParserLib.slnx

      - name: Test
        uses: ./.github/actions/dotnet-test
        with:
          solution-file: SourceDocParserLib.slnx

      - name: Pack
        working-directory: src
        run: dotnet pack SourceDocParserLib.slnx --no-build --configuration Release -o "${GITHUB_WORKSPACE}/packages"

      - name: Install GitReleaseNoteGenerator
        run: dotnet tool install -g GitReleaseNoteGenerator

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: git-release-notes --release-version "$RELEASE_VERSION" --output-file release-notes.md

      - name: Upload unsigned packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-nuget
          path: packages/*.nupkg
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:54d12a5f55d2ddee42adbd67e9a25d95ed451ceee80bfe8ad2c3da36102876f2
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
      - name: Checkout release actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions

      - name: Download unsigned packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-nuget
          path: signed

      - name: Sign packages with Certum SimplySign
        uses: ./.github/actions/certum-sign
        with:
          packages-glob: 'signed/*.nupkg'

      - name: Upload signed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-nuget
          path: signed/*.nupkg
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 11.0.x

      - name: Download signed packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-nuget
          path: signed

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: .

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          var packages = Directory.GetFiles(Path.Combine(GetEnvironmentVariable("GITHUB_WORKSPACE")!, "signed"), "*.nupkg");
          if (packages is [])
          {
              Console.WriteLine("::error::No signed packages were downloaded.");
              return 1;
          }

          foreach (var package in packages.Order(StringComparer.Ordinal))
          {
              if (Process.Run("dotnet", ["nuget", "push", package, "--source", "https://api.nuget.org/v3/index.json", "--api-key", GetEnvironmentVariable("NUGET_API_KEY")!]) is { ExitCode: not 0 } push)
              {
                  return push.ExitCode;
              }
          }

          return 0;
          CS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          TARGET: ${{ needs.build.outputs.source-sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          Directory.SetCurrentDirectory(GetEnvironmentVariable("GITHUB_WORKSPACE")!);
          return Process.Run("gh",
          [
              "release", "create", GetEnvironmentVariable("TAG")!,
              "--repo", GetEnvironmentVariable("REPOSITORY")!,
              "--target", GetEnvironmentVariable("TARGET")!,
              "--title", GetEnvironmentVariable("VERSION")!,
              "--notes-file", "release-notes.md",
              .. Directory.GetFiles("signed", "*.nupkg"),
          ]).ExitCode;
          CS
