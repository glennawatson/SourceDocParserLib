name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release increment."
        required: true
        type: choice
        options:
        - "(pick one)"
        - major
        - minor
        - patch
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      source-sha: ${{ github.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        minver-tag-prefix: 'v'
        minver-minimum-major-minor: '1.4'
        minver-auto-increment: 'minor'
        stamp-version: 'false'
    - name: Compute release version
      id: ver
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: 'v'
        push-tag: 'false'
    - name: Stamp release version
      uses: glennawatson/actions-common/.github/actions/minver@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        tag-prefix: 'v'
        minimum-major-minor: '1.4'
        auto-increment: 'minor'
        version-override: ${{ steps.ver.outputs.version }}
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.x'
    - name: Build
      uses: glennawatson/actions-common/.github/actions/dotnet-build@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        solution-file: SourceDocParserLib.slnx
    - name: Pack
      shell: bash
      run: dotnet "pack" "SourceDocParserLib.slnx" "--no-build" "--configuration" "Release" "-o" "${GITHUB_WORKSPACE}/packages"
      working-directory: src
    - name: Upload unsigned packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: unsigned-nuget
        path: packages/*.nupkg
        if-no-files-found: error
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      packages: read
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        stamp-version: false
        dotnet-versions: 11.0.x
    - name: Download unsigned packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unsigned-nuget
        path: signed
    - name: Sign packages with Certum SimplySign
      uses: glennawatson/actions-common/.github/actions/certum-sign@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        packages-glob: 'signed/*.nupkg'
    - name: Upload signed packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: signed-nuget
        path: signed/*.nupkg
        if-no-files-found: error
  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Setup .NET
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        stamp-version: false
        dotnet-versions: 11.0.x
    - name: Download signed packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: signed-nuget
        path: signed
    - name: NuGet login (OIDC trusted publishing)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      shell: bash
      run: dotnet nuget push "signed/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
  create-release:
    needs:
    - build
    - publish
    permissions:
      contents: write
    uses: glennawatson/actions-common/.github/workflows/workflow-common-create-release.yml@381282a6137c4f3c099ff80d9ee909e5d262998a
    with:
      version: ${{ needs.build.outputs.version }}
      tag: ${{ needs.build.outputs.tag }}
      target: ${{ needs.build.outputs.source-sha }}
      prerelease: false
...
