name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Auto-increment level for the new tag. You must pick one."
        required: true
        type: choice
        options:
          - "(pick one)"
          - major
          - minor
          - patch

permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compute next version + create tag
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # MinVer is tag-first and won't compute a clean RTM version when the
          # working commit is past the latest tag (it appends pre-release +
          # height by design). So compute the bump in shell from the latest
          # RTM tag, tag HEAD, push — then propagate the version through
          # MINVERVERSIONOVERRIDE so every downstream MSBuild project skips
          # MinVer's per-project git walk and stamps this exact value.
          case "$BUMP" in
            major|minor|patch) ;;
            *) echo "Pick a bump level (major / minor / patch)." >&2; exit 1 ;;
          esac
          LAST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                  | grep -Ev -- '-' \
                  | sort -V \
                  | tail -1 \
                  | sed 's/^v//')"
          if [ -z "$LAST" ]; then
            echo "No RTM tag (vX.Y.Z) found in history." >&2
            exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<<"$LAST"
          case "$BUMP" in
            major) VERSION="$((MAJ+1)).0.0" ;;
            minor) VERSION="${MAJ}.$((MIN+1)).0" ;;
            patch) VERSION="${MAJ}.${MIN}.$((PAT+1))" ;;
          esac
          echo "Latest RTM tag: v$LAST → next: v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "MINVERVERSIONOVERRIDE=$VERSION" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # Python is required by SourceDocParser.IntegrationTests' Zensical
      # render-smoke (see ci.yml for context).
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Restore
        run: dotnet restore src/SourceDocParserLib.slnx

      - name: Build
        run: dotnet build src/SourceDocParserLib.slnx --no-restore --configuration Release

      - name: Pack
        run: dotnet pack src/SourceDocParserLib.slnx --no-build --configuration Release -o packages

      - name: Sign packages with SSL.com eSigner
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ./packages
          output_path: ./signed
          malware_block: true
          jvm_max_memory: 2048M

      - name: Upload signed packages
        uses: actions/upload-artifact@v7
        with:
          name: signed-nuget
          path: ./signed/*.nupkg
          if-no-files-found: error

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in ./signed/*.nupkg; do
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
          done

      - name: Install GitReleaseNoteGenerator
        run: dotnet tool install -g GitReleaseNoteGenerator

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: git-release-notes --release-version "$VERSION" --output-file release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --title "$VERSION" --notes-file release-notes.md ./signed/*.nupkg
