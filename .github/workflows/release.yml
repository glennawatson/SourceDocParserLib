name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release increment."
        required: true
        type: choice
        options:
        - "(pick one)"
        - major
        - minor
        - patch
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      source-sha: ${{ github.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
      with:
        minver-tag-prefix: 'v'
        minver-minimum-major-minor: '1.4'
        minver-auto-increment: 'minor'
        stamp-version: 'false'
    - name: Compute release version
      id: ver
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@main
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: 'v'
        push-tag: 'false'
    - name: Stamp release version
      uses: glennawatson/actions-common/.github/actions/minver@main
      with:
        tag-prefix: 'v'
        minimum-major-minor: '1.4'
        auto-increment: 'minor'
        version-override: ${{ steps.ver.outputs.version }}
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.x'
    - name: Build
      uses: glennawatson/actions-common/.github/actions/dotnet-build@main
      with:
        solution-file: SourceDocParserLib.slnx
    - name: Pack
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: dotnet
        arguments: |-
          pack
          SourceDocParserLib.slnx
          --no-build
          --configuration
          Release
          -o
          ${GITHUB_WORKSPACE}/packages
        working-directory: src
    - name: Install GitReleaseNoteGenerator
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: dotnet
        arguments: |-
          tool
          install
          -g
          GitReleaseNoteGenerator
        working-directory: .
    - name: Generate release notes
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ steps.ver.outputs.version }}
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: git-release-notes
        arguments: |-
          --release-version
          $RELEASE_VERSION
          --output-file
          release-notes.md
        working-directory: .
    - name: Upload unsigned packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: unsigned-nuget
        path: packages/*.nupkg
        if-no-files-found: error
    - name: Upload release notes
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-notes
        path: release-notes.md
        if-no-files-found: error
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:ee5d4af12d51a9bd75e7008df78880cb7d352a841573647674f70cb587809554
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
    - name: Download unsigned packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unsigned-nuget
        path: signed
    - name: Sign packages with Certum SimplySign
      uses: glennawatson/actions-common/.github/actions/certum-sign@main
      with:
        packages-glob: 'signed/*.nupkg'
    - name: Upload signed packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: signed-nuget
        path: signed/*.nupkg
        if-no-files-found: error
  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Setup .NET
      uses: glennawatson/actions-common/.github/actions/setup-sdk@main
      with:
        dotnet-version: 11.0.x
    - name: Download signed packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: signed-nuget
        path: signed
    - name: Download release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-notes
        path: .
    - name: NuGet login (OIDC trusted publishing)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: push-to-nuget-d58e357f8c.cs
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        TAG: ${{ needs.build.outputs.tag }}
        TARGET: ${{ needs.build.outputs.source-sha }}
        VERSION: ${{ needs.build.outputs.version }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: create-github-release-ced406cb4e.cs
